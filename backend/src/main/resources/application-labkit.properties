# Labkit profile: local "staging" for the Day 2 labs.
# Run with: mvnw spring-boot:run -Dspring-boot.run.profiles=labkit
# Without this profile the app behaves as before.

# JSON logs (ECS) for the labkit Grafana mock. The console keeps the normal format.
logging.file.name=logs/app.json
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=1

# Read-only DB access over the Postgres protocol (labkit/mcp/db.mjs).
# This is a local training value, not a real secret. Override with LABKIT_DB_PASSWORD.
labkit.db.port=5435
labkit.db.user=labkit_ro
labkit.db.password=${LABKIT_DB_PASSWORD:labkit-readonly}

# Keep H2 trace messages (for example from the read-only user) out of the console.
spring.datasource.url=jdbc:h2:mem:banklab;DB_CLOSE_DELAY=-1;TRACE_LEVEL_FILE=0
